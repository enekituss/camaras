name: Diagnóstico de URL de cámara

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Consultar las cabeceras de la cámara ID 507
        run: |
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          base = "https://movilidad.aytoburgos.es"
          path = "/documents/848507/848509/507/2b6aa023-d4c3-786e-6908-ada588e9eeb2"
          stamp = str(int(time.time() * 1000))
          variants = [
              ("original", path + "?version=2.0&t=1792156674915"),
              ("sin parámetros", path),
              ("t actual", path + "?version=2.0&t=" + stamp),
              ("parámetro _probe", path + "?version=2.0&t=1792156674915&_probe=" + stamp),
          ]
          for label, route in variants:
              req = urllib.request.Request(base + route, headers={
                  "User-Agent": "Mozilla/5.0 (compatible; CameraSourceDiagnostic/1.0)",
                  "Referer": "https://movilidad.aytoburgos.es/fr/camaras-de-trafico",
                  "Cache-Control": "no-cache",
                  "Pragma": "no-cache",
              })
              print("\\n=== " + label + " ===", flush=True)
              try:
                  with urllib.request.urlopen(req, timeout=5) as response:
                      print("status:", response.status, flush=True)
                      print("content_type:", response.headers.get("Content-Type"), flush=True)
                      print("content_disposition:", response.headers.get("Content-Disposition"), flush=True)
                      print("content_length:", response.headers.get("Content-Length"), flush=True)
                      print("cache_control:", response.headers.get("Cache-Control"), flush=True)
                      print("final_url:", response.geturl(), flush=True)
                      # We intentionally do not read the body: some camera endpoints may be streams.
              except urllib.error.HTTPError as e:
                  print("http_error:", e.code, e.reason, "content_type:", e.headers.get("Content-Type"), flush=True)
              except Exception as e:
                  print("request_error:", type(e).__name__, str(e)[:150], flush=True)
          PY
